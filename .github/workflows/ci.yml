name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
          - name: ubuntu-clang-debug-sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
          - name: macos-clang-release
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
          # MSVC does not build yet (C-mode gaps such as max_align_t); keep
          # the job informational until it passes.
          - name: windows-msvc-release
            os: windows-latest
            msvc: true
            build_type: Release
            experimental: true
          - name: windows-mingw-release
            os: windows-latest
            mingw: true
            build_type: Release

    defaults:
      run:
        shell: ${{ matrix.mingw && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSYS2 (MinGW)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Set up MSVC
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      # Ninja everywhere: the MSVC job gets its toolchain from msvc-dev-cmd, so
      # no Visual Studio generator version needs to be pinned.
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel -- -k 0

      # Performance tests assert on wall-clock ratios and are not meaningful on
      # shared runners. The allocator test deliberately requests SIZE_MAX bytes
      # and expects NULL, which ASan must be told to allow.
      - name: Test
        env:
          ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel 4 --label-exclude performance

      - name: Smoke-run CLI
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/tools/nmo.exe --version
          else
            ./build/tools/nmo --version
          fi
