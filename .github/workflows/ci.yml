name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
          - name: ubuntu-clang-debug-sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
          - name: macos-clang-release
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
          - name: windows-msvc-release
            os: windows-latest
            msvc: true
            build_type: Release
          - name: windows-mingw-release
            os: windows-latest
            mingw: true
            build_type: Release

    defaults:
      run:
        shell: ${{ matrix.mingw && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSYS2 (MinGW)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      # Load the x64 developer environment from vcvars64.bat into later steps.
      # This replaces ilammy/msvc-dev-cmd, which is unmaintained and still on
      # Node.js 20.
      - name: Set up MSVC
        if: matrix.msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw "No Visual Studio installation with MSVC found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }

      # Ninja everywhere: the MSVC job gets its toolchain from vcvars64.bat, so
      # no Visual Studio generator version needs to be pinned.
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel -- -k 0

      # Performance tests assert on wall-clock ratios and are not meaningful on
      # shared runners. The allocator test deliberately requests SIZE_MAX bytes
      # and expects NULL, which ASan must be told to allow.
      - name: Test
        env:
          ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel 4 --label-exclude performance

      - name: Smoke-run CLI
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/tools/nmo.exe --version
          else
            ./build/tools/nmo --version
          fi

  line-count:
    name: line-count-report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull requests compare against the merge base so the delta column shows
      # only what the PR adds; pushes compare against the previous commit.
      - name: Report lines per directory
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            base=HEAD~1
          else
            base=
          fi
          {
            echo "## Lines per directory"
            echo
            python3 tools/scripts/line_count_report.py ${base:+--base "$base"}
          } >> "$GITHUB_STEP_SUMMARY"
