name: CI

# Every run builds, tests and packages each release platform and keeps the
# packages as artifacts. A tag vX.Y.Z also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Performance tests assert on wall-clock ratios and are not meaningful on
  # shared runners. The allocator test deliberately requests SIZE_MAX bytes
  # and expects NULL, which ASan must be told to allow.
  sanitizers:
    name: ubuntu-clang-debug-sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNMO_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel -- -k 0

      - name: Test
        env:
          ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel 4 --label-exclude performance

  # Every automatic variable starts as 0xAA bytes, so a struct that is used
  # without being cleared fails the same way on every platform instead of
  # depending on what the stack held (macOS happened to hand out zeros).
  auto-var-init:
    name: ubuntu-clang-pattern-init
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: clang
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_FLAGS=-ftrivial-auto-var-init=pattern
          -DNMO_ENABLE_SANITIZERS=OFF

      - name: Build
        run: cmake --build build --parallel -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4 --label-exclude performance

  # MemorySanitizer reports a read of memory that was allocated or declared
  # but never written, which pattern initialization cannot see for heap
  # blocks and struct padding. Origin tracking names the allocation.
  memory-sanitizer:
    name: ubuntu-clang-msan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: clang
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DNMO_ENABLE_SANITIZERS=OFF
          "-DCMAKE_C_FLAGS=-O1 -fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=memory

      - name: Build
        run: cmake --build build --parallel -- -k 0

      - name: Test
        env:
          MSAN_OPTIONS: print_stats=0:halt_on_error=1:exitcode=86
        run: ctest --test-dir build --output-on-failure --parallel 4 --label-exclude performance

  # The renderer's graphics backends and the window (NMO_VIEWER: OpenGL,
  # SDL_GPU and SDL3) are left out of the release builds, which have no
  # SDL3; built here on every system, so code only one of them compiles does
  # not get in. Of the runners only the macOS one has a GPU to draw with: the
  # SDL_GPU tests skip elsewhere, and the software backend's tests carry the
  # pixels.
  render-backends:
    name: render-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-latest
          - platform: windows-msvc
            os: windows-latest
            msvc: true
          - platform: windows-mingw
            os: windows-latest
            mingw: true
    env:
      SDL3_VERSION: 3.4.18

    defaults:
      run:
        shell: ${{ matrix.mingw && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Ubuntu has no SDL3 package: built from its release, without X11 or
      # Wayland (the job opens no window, and X11 brings a dozen packages).
      - name: Install SDL3 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev
          curl -fsSL --retry 3 -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-$SDL3_VERSION.tar.gz"
          tar -xzf sdl.tar.gz
          cmake -S "SDL3-$SDL3_VERSION" -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build sdl-build
          sudo cmake --install sdl-build
          sudo ldconfig

      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl3

      - name: Set up MSYS2 with SDL3 (MinGW)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3

      - name: Set up MSVC
        if: matrix.msvc
        uses: ./.github/actions/setup-msvc

      # SDL's development release for Visual C++: headers, import library,
      # DLL and CMake package. The DLL's folder goes on PATH for the tests.
      - name: Install SDL3 (MSVC)
        if: matrix.msvc
        run: |
          curl -fsSL --retry 3 -o sdl.zip \
            "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-devel-$SDL3_VERSION-VC.zip"
          unzip -q sdl.zip
          echo "SDL3_DIR=$(cygpath -m "$PWD/SDL3-$SDL3_VERSION/cmake")" >> "$GITHUB_ENV"
          cygpath -w "$PWD/SDL3-$SDL3_VERSION/lib/x64" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNMO_VIEWER=ON

      - name: Build
        run: cmake --build build --parallel -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure -R "render|view|cli_behavior_run|layering"

  # The Python binding (bindings/python) loads libnmo as a shared library,
  # which the release packages, static only, do not hold. Each system builds
  # the library shared here and runs the binding's tests against it; they read
  # a sample kept beside them, so they need no Virtools files. A missing Python
  # leaves the test unregistered, which --no-tests=error turns into a failure.
  # CMake takes the Python on PATH, not the one the Windows registry names:
  # the MinGW job needs MSYS2's, whose folder holds the MinGW runtime DLLs
  # libnmo.dll loads (Python looks for a DLL's dependencies on no PATH).
  shared-library:
    name: shared-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows-msvc
            os: windows-latest
            msvc: true
          - platform: windows-mingw
            os: windows-latest
            mingw: true

    defaults:
      run:
        shell: ${{ matrix.mingw && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        if: ${{ !matrix.mingw }}
        with:
          python-version: '3.x'

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSYS2 (MinGW)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Set up MSVC
        if: matrix.msvc
        uses: ./.github/actions/setup-msvc

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DNMO_BUILD_SHARED=ON -DNMO_BUILD_TOOLS=OFF -DPython3_FIND_REGISTRY=NEVER

      - name: Build
        run: cmake --build build --target nmo

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -R "^test_python_binding$"

  # Release builds: tools/scripts/package_release.py runs the test suite,
  # installs the package, checks it from the outside and archives it.
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner, so the binaries need the oldest glibc.
          - platform: linux-x64
            os: ubuntu-22.04
          - platform: macos-universal
            os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - platform: windows-msvc-x64
            os: windows-latest
            msvc: true
          # Statically linked runtime: nmo.exe runs without MSYS2 DLLs.
          - platform: windows-mingw-x64
            os: windows-latest
            mingw: true
            cmake_args: -DNMO_MINGW_STATIC_RUNTIME=ON
            package_args: --forbid-import libwinpthread

    defaults:
      run:
        shell: ${{ matrix.mingw && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        if: ${{ !matrix.mingw }}
        with:
          python-version: '3.x'

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSYS2 (MinGW)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      # Ninja everywhere: the MSVC job gets its toolchain from vcvars64.bat, so
      # no Visual Studio generator version needs to be pinned.
      - name: Set up MSVC
        if: matrix.msvc
        uses: ./.github/actions/setup-msvc

      - name: Build, test and package
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args }}
          PACKAGE_ARGS: ${{ matrix.package_args }}
        run: |
          python tools/scripts/package_release.py --platform ${{ matrix.platform }} \
            $PACKAGE_ARGS -- $CMAKE_ARGS

      - uses: actions/upload-artifact@v7
        with:
          name: libnmo-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish-release
    needs: [sanitizers, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The version lives in both nmo_types.h and project(); the tag must
      # match them and have a CHANGELOG section to use as release notes.
      - name: Check version
        id: version
        run: |
          version=$(awk '/^#define NMO_VERSION_(MAJOR|MINOR|PATCH) / {
            v = v (v == "" ? "" : ".") $3 } END { print v }' include/nmo_types.h)
          project_version=$(awk '/^project\(libnmo/ { p = 1 }
            p && $1 == "VERSION" { print $2; exit }' CMakeLists.txt)
          if [ "$version" != "$project_version" ]; then
            echo "::error::nmo_types.h says $version but CMakeLists.txt says $project_version"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          (cd dist && cat *.sha256 > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "libnmo $VERSION" \
            --notes-file release-notes.md \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS
