name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
          - name: ubuntu-clang-debug-sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
          - name: macos-clang-release
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
          - name: windows-msvc-release
            os: windows-latest
            msvc: true
            build_type: Release
          - name: windows-mingw-release
            os: windows-latest
            mingw: true
            build_type: Release

    defaults:
      run:
        shell: ${{ matrix.mingw && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSYS2 (MinGW)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Set up MSVC
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "${{ matrix.msvc }}" = "true" ]; then
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          fi

      - name: Build
        run: cmake --build build --parallel --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4 -C ${{ matrix.build_type }}

      - name: Smoke-run CLI
        run: |
          if [ "${{ matrix.msvc }}" = "true" ]; then
            ./build/tools/${{ matrix.build_type }}/nmo.exe --version
          elif [ "${{ runner.os }}" = "Windows" ]; then
            ./build/tools/nmo.exe --version
          else
            ./build/tools/nmo --version
          fi
