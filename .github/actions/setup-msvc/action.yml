name: Set up MSVC
description: >-
  Load the x64 developer environment from vcvars64.bat into later steps. This
  replaces ilammy/msvc-dev-cmd, which is unmaintained and still on Node.js 20.
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        if (-not $vs) { throw "No Visual Studio installation with MSVC found" }
        $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
        cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
          if ($_ -match '^([^=]+)=(.*)$') {
            "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
        }
        if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
