[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libnmo"
version = "0.2.0"
description = "Read, edit and convert Virtools .nmo/.cmo/.vmo files with libnmo"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
]

[tool.setuptools]
packages = ["nmo"]

[tool.setuptools.package-data]
# A wheel may carry the shared library and libnmo's data tables next to the package
nmo = ["*.dylib", "*.so", "*.so.*", "*.dll", "data/*.json"]
